services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:8080"
    environment:
      - BACKEND_URL=http://backend:8080
      - PORT=8080
    depends_on:
      - backend
