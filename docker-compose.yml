services:
  backend:
    build:
      context: ./backend
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
    command: uvicorn main:app --host 0.0.0.0 --port 8080 --reload
    develop:
      watch:
        - action: sync
          path: ./backend
          target: /app
          ignore:
            - __pycache__/

  frontend:
    build:
      context: ./frontend
    ports:
      - "80:8080"
    environment:
      - BACKEND_URL=http://backend:8080
      - PORT=8080
    depends_on:
      - backend
    develop:
      watch:
        - action: rebuild
          path: ./frontend
